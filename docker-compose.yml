version: "3.9"

services:

  backend:
    build: ./server
    container_name: backend

    env_file:
      - ./server/.env

    expose:
      - "5000"

    restart: always

    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile


    container_name: nginx

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: always

    networks:
      - app-network

networks:
  app-network:
     driver: bridge




